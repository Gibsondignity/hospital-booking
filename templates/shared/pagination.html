{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination"><span class="muted">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div class="actions">{% if page_obj.has_previous %}<a class="btn" href="?page={{ page_obj.previous_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn" href="?page={{ page_obj.next_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}">Next</a>{% endif %}</div></nav>{% endif %}
