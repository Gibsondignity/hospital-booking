<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | {{ clinic_configuration.name|default:"Eye Clinic" }}</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4f7;color:#183047;font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(420px,calc(100% - 32px));background:white;border:1px solid #dce6ee;border-radius:16px;padding:32px}h1{margin:0 0 4px;font-size:24px}.muted{color:#6c7e8d;margin-bottom:24px}label{display:block;font-weight:600;margin:14px 0 5px}.form-control{width:100%;padding:11px;border:1px solid #dce6ee;border-radius:8px;font:inherit}button{width:100%;margin-top:20px;padding:11px;background:#087e8b;color:white;border:0;border-radius:8px;font:inherit;font-weight:600}.errorlist{color:#bd3643;padding-left:18px}.brand{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#087e8b;font-weight:700;margin-bottom:16px}</style></head><body><main class="card"><div class="brand">{{ clinic_configuration.name|default:"Eye Clinic" }}</div><h1>Staff sign in</h1><p class="muted">Access the clinic management system.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}{% endfor %}<button type="submit">Sign in</button></form></main></body></html>
